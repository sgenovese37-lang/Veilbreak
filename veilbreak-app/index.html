<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VEILBREAK</title>
  <meta name="theme-color" content="#101114">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icone/icona-192.png">
  <link rel="apple-touch-icon" href="./assets/icone/icona-192.png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="slide" style="--img: url('assets/sfondi/home-hollow.webp'); --n: 0"></div>
    <div class="slide" style="--img: url('assets/sfondi/home-neon.webp'); --n: 1"></div>
    <div class="slide" style="--img: url('assets/sfondi/home-saints.webp'); --n: 2"></div>
    <div class="slide" style="--img: url('assets/sfondi/home-undercity.webp'); --n: 3"></div>
    <div class="fog"></div><div class="fog two"></div><div class="vignette"></div>
  </div>
  <canvas id="embers" aria-hidden="true"></canvas>
  <header class="topstrip">
    <span class="sigil" aria-hidden="true">V</span>
    <button id="wallet" class="wallet" type="button" aria-live="polite" aria-label="Schegge e buste: apri il negozio"></button>
    <button id="settings-open" class="icon-button" type="button" aria-label="Impostazioni"><i data-icon="gear"></i></button>
  </header>
  <dialog id="settings-panel" aria-label="Impostazioni">
    <div class="settings-body">
      <h2>Impostazioni</h2>
      <div class="settings-row"><button id="sound-toggle" type="button"></button><button id="music-toggle" type="button"></button></div>
      <button id="intro-toggle" type="button"></button>
      <button id="saver-toggle" type="button"></button>
      <label>Lingua <select id="lang-select" class="lang" aria-label="Lingua"></select></label>
      <button id="settings-close" class="primary" type="button">Chiudi</button>
    </div>
  </dialog>
  <nav class="dock" aria-label="Sezioni">
    <button id="match" aria-controls="table"><i data-icon="swords"></i><span>Partita</span></button>
    <button id="story-nav" aria-controls="story"><i data-icon="book"></i><span>Storia</span></button>
    <button id="quests-nav" aria-controls="quests"><i data-icon="scroll"></i><span>Missioni</span></button>
    <button id="decks" aria-controls="deck-editor"><i data-icon="layers"></i><span>Mazzi</span></button>
    <button id="library" aria-controls="catalogue"><i data-icon="cards"></i><span>Collezione</span></button>
    <button id="shop-nav" aria-controls="negozio"><i data-icon="chest"></i><span>Negozio</span></button>
    <button id="missions" aria-controls="tutorial"><i data-icon="candle"></i><span>Tutorial</span></button>
  </nav>
  <main>
    <section id="setup" class="home">
      <div class="home-hero">
        <h1 class="logo">VEILBREAK</h1>
        <p class="tagline">Il Velo si è spezzato. Scegli il tuo Binder.</p>
      </div>
      <h2 class="visually-hidden">Nuova partita</h2>
      <form id="settings">
        <label>Modalità <select name="mode"><option value="cpu">Contro il computer</option><option value="local">Due giocatori sullo stesso dispositivo</option></select></label>
        <label id="difficulty">Difficoltà <select name="level"><option value="Facile">Facile</option><option value="Normale" selected>Normale</option><option value="Difficile">Difficile</option></select></label>
        <label>Prima fazione <select name="first"></select></label>
        <label>Seconda fazione <select name="second"></select></label>
        <label>Ambientazione <select name="env">
          <option value="auto">Automatica (fazione avversaria)</option>
          <option value="hollow">Sala del Consiglio · Corte di Hollow</option>
          <option value="neon">Centrale delle Frequenze · Patto Neon</option>
          <option value="saints">Cappella dell’Aureola Spezzata · Senza Santi</option>
          <option value="undercity">Deposito Sotto le Rotaie · Sottocittà</option>
        </select></label>
        <button class="primary">Inizia partita</button>
      </form>
    </section>
    <section id="table" hidden aria-label="Tavolo di gioco"></section>
    <section id="story" class="sheet wide" hidden aria-label="Modalità Storia"></section>
    <section id="quests" class="sheet wide" hidden aria-label="Missioni e premi"></section>
    <section id="negozio" class="sheet wide" hidden aria-label="Negozio"><div id="shop" class="shop"></div></section>
    <section id="deck-editor" class="sheet" hidden aria-label="Costruisci un mazzo"></section>
    <section id="tutorial" class="sheet" hidden aria-label="Tutorial a missioni"></section>
    <section id="catalogue" hidden aria-labelledby="catalogue-title">
      <div class="section-head">
        <h2 id="catalogue-title">Carte</h2>
        <label>Fazione <select id="filter"><option value="">Tutte</option></select></label>
      </div>
      <div id="cards" class="cards catalogue"></div>
    </section>
  </main>
  <dialog id="card-viewer" aria-label="Dettaglio carta"></dialog>
</body>
</html>
